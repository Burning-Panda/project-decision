<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decision Log</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Decision Log</h1>
    <nav>
      <button data-view="decisions">Decisions</button>
      <button data-view="dashboard">Dashboard</button>
      <button data-view="todos">My todos</button>
      <button data-view="new">+ New decision</button>
    </nav>
    <label class="who">Signed in as <input id="user" type="email" placeholder="you@company.com"></label>
  </header>
  <div id="error" role="alert" hidden></div>
  <main id="main"></main>
  <script src="/app.js"></script>
</body>
</html>
